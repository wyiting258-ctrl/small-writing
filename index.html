<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研英语小作文 · 交互拼装模板（英一英二通用）</title>
<style>
:root{
  --ink:#1b2333; --ink-2:#3d4a63; --muted:#7c889e; --line:#e2e7f0;
  --bg:#f5f7fb; --panel:#ffffff; --brand:#1f4b8f; --brand-2:#2f6fd0;
  --accent:#c8791f; --accent-soft:#fdf3e3; --ok:#1f7a5c; --ok-soft:#e8f6ef;
  --chip:#eef4ff; --chip-line:#b9cdf0; --shadow:0 1px 2px rgba(20,35,60,.06),0 8px 24px rgba(20,35,60,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.01em}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::selection{background:#cfe0ff}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92);
  backdrop-filter:saturate(160%) blur(8px); border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1460px;margin:0 auto;padding:10px 20px;display:flex;flex-direction:column;gap:9px}
.brandline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:#8a5310;border:1px solid #f0dcbc;white-space:nowrap}
.spacer{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line); background:#fff; border-radius:10px; padding:5px 12px;
  font-size:13px; font-weight:600; color:var(--ink-2); transition:.15s;
}
.btn:hover{border-color:#c3d0e6;background:#f8faff}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.modes{display:flex;gap:6px;flex-wrap:wrap}
.mode{
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap;
}
.mode:hover{border-color:#b9cdf0}
.mode[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(31,75,143,.25)}

.toolrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.presets{display:flex;align-items:center;gap:8px}
.presets select{
  border:1px solid var(--line); border-radius:10px; padding:5px 8px; background:#fff; max-width:330px;
}
.toggles{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.scope{font-size:11.5px;color:#9aa4b8;border-left:1px solid var(--line);padding-left:12px}
.tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .sw{width:30px;height:17px;border-radius:999px;background:#d7deea;position:relative;transition:.18s;flex:0 0 auto}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg input:checked + .sw{background:var(--brand-2)}
.tg input:checked + .sw::after{transform:translateX(13px)}
.tg input:focus-visible + .sw{outline:2px solid var(--brand-2);outline-offset:2px}

/* ---------- 布局 ---------- */
.wrap{max-width:1460px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
@media (max-width:1180px){ .wrap{grid-template-columns:1fr} .preview-col{position:static !important} }

/* ---------- 编排区 ---------- */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.blockhead{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(180deg,#fbfcff,#f5f8ff);border-bottom:1px solid var(--line);flex-wrap:wrap}
.blockhead h3{font-size:14px;color:var(--brand)}
.blockhead .sub{font-size:12px;color:var(--muted)}
.blockhead .grow{flex:1}
.planlabel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.planlabel select{border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:#fff;font-size:12px;max-width:300px}
.blockbody{padding:6px 16px 14px}

.row{padding:10px 0;border-bottom:1px dashed #eef1f7}
.row:last-child{border-bottom:0}
.rowhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tag{font-size:11px;font-weight:700;color:var(--brand);background:#eaf1fd;border:1px solid #d4e2f9;border-radius:6px;padding:0 6px;letter-spacing:.02em}
.rlabel{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rowhead select{
  margin-left:auto; max-width:min(430px,60%); border:1px solid var(--line); border-radius:8px;
  padding:3px 6px; background:#fff; font-size:12px; color:var(--ink-2);
}
.sentence{font-size:14.5px;line-height:2.1;color:var(--ink);word-break:break-word}
.sentence .lit{}
.chip{
  display:inline; border:0; background:transparent; padding:0 2px; margin:0;
  border-bottom:2px dotted var(--chip-line); border-radius:3px; color:var(--brand); font-weight:600;
  line-height:1.5; font-size:14px;
}
.chip:hover{background:var(--chip);border-bottom-color:var(--brand-2)}
.chip.empty{color:var(--accent);border-bottom:2px dashed #e3bd85;background:var(--accent-soft);font-weight:500}
.chip.empty:hover{background:#fbe9cd}
.chip.auto{color:#0f6b52;border-bottom-color:#9fd3c0;background:var(--ok-soft)}
.note{font-size:12px;color:var(--muted);margin-top:2px}
.note b{color:var(--accent);font-weight:700}
.missing .sentence{color:#8b93a5}
textarea.custom{
  width:100%;margin-top:6px;border:1px solid #e6d3b3;background:#fffdf8;border-radius:9px;
  padding:8px 10px;font-size:13.5px;line-height:1.75;resize:vertical;min-height:58px;
}
textarea.custom:focus{outline:2px solid #f0d9ae;outline-offset:0}

/* 格式头 / 落款 */
.frame-list{padding:12px 16px;display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center}
.frame-list .k{font-size:12px;color:var(--muted);font-weight:600}
.frame-line{font-size:14.5px}

/* ---------- 预览 ---------- */
.preview-col{position:sticky;top:150px}
.preview{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.preview-head{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcff,#f5f8ff)}
.preview-head h3{font-size:14px;color:var(--brand)}
.preview-head .stat{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.preview-body{padding:6px 18px 18px;max-height:calc(100vh - 250px);overflow:auto}
.pblock{padding:12px 0;border-bottom:1px dashed #eef1f7}
.pblock:last-child{border-bottom:0}
.pblock h4{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.pblock h4 .cn{color:var(--brand);opacity:.85}
.pen{font-size:14.5px;line-height:1.95;color:var(--ink);white-space:pre-wrap}
.pen .sh{color:var(--brand);font-weight:600}
.pzh{font-size:12.5px;line-height:1.8;color:#8a94a8;margin-top:3px;white-space:pre-wrap}
.pen.placeholder{color:#c0c7d6}

/* 考场精简 */
body.exam .chip{border-bottom:0;background:transparent;color:var(--ink);font-weight:inherit;padding:0;margin:0}
body.exam .chip.empty{color:#b9c2d4;background:transparent}
body.exam .note,body.exam .sub,body.exam .pzh{display:none}
body.exam .blockhead{background:#fff}
body.no-zh .pzh{display:none}
body.no-note .note{display:none}
body.no-ghost .chip.empty{color:transparent;background:transparent;border-bottom-color:transparent}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(22,32,52,.42);display:flex;align-items:flex-end;justify-content:center;padding:0}
.overlay[hidden]{display:none}
.dlg{background:#fff;width:min(720px,100%);max-height:82vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(10,20,40,.25)}
.dlg-head{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dlg-head .t{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px}
.dlg-head .t .lbl{color:var(--brand);white-space:nowrap}
.dlg-head .t #dlgTitleZh{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg-head .z{font-size:12px;color:var(--muted);margin-top:3px}
.dlg-search{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.dlg-search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.dlg-list{padding:8px 12px 14px;overflow:auto;flex:1}
.opt{display:block;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:2px}
.opt:hover{background:#f7faff;border-color:#dbe6fa}
.opt .en{font-weight:600;font-size:13.5px;color:var(--ink)}
.opt .zh{font-size:12px;color:var(--muted);margin-top:1px}
.opt .tagline{font-size:11px;color:var(--accent);margin-top:1px}
.opt[aria-selected="true"]{background:#eef4ff;border-color:#b9cdf0}
.dlg-foot{padding:10px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-foot input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:7px 10px}

.toast{
  position:fixed;left:24px;bottom:24px;z-index:120;
  background:#1b2333;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.22s;
  box-shadow:0 10px 30px rgba(10,20,40,.3);max-width:min(420px,80vw)
}
.toast.show{opacity:1;transform:translateY(0)}

.hintbar{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);box-shadow:var(--shadow)}
.hintbar b{color:var(--brand)}
.hintbar .src{color:var(--muted);font-size:11.5px;display:block;margin-top:3px}

@media (max-width:640px){
  .wrap{padding:12px 10px 60px}
  .blockbody{padding:4px 10px 10px}
  .frame-list{grid-template-columns:72px 1fr;padding:10px}
  .rowhead select{max-width:100%;margin-left:0;width:100%}
  .preview-body{padding:4px 12px 14px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brandline">
      <div class="brand"><b>考研英语小作文 · 交互拼装模板</b><span>英一英二通用 · 严格覆盖讲义全部待选句</span></div>
      <span class="badge" id="modeBadge">回复信</span>
      <div class="spacer"></div>
      <div class="actions">
        <button class="btn" id="undoBtn" type="button" title="撤销上一步（Ctrl+Z）">↶ 撤销</button>
        <button class="btn" id="clearBtn" type="button">清空</button>
        <button class="btn primary" id="copyBtn" type="button">复制全文</button>
      </div>
    </div>

    <div class="modes" id="modes" role="group" aria-label="题型分支"></div>

    <div class="toolrow">
      <div class="presets">
        <label for="presetSel">真题预设</label>
        <select id="presetSel"></select>
      </div>
      <div class="toggles" id="toggles"></div>
      <span class="scope">讲义范围：2.1 书信 / 2.2 通知告示 / 2.3 纪要；图表・图画属大作文，本讲义未涉及</span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="composer-col">
    <div class="hintbar" id="modeHint"></div>
    <div id="composer"></div>
  </section>

  <aside class="preview-col">
    <div class="preview">
      <div class="preview-head">
        <h3>全文预览</h3>
        <span class="stat" id="stat"></span>
      </div>
      <div class="preview-body" id="preview"></div>
    </div>
  </aside>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head">
      <div class="t"><span class="lbl" id="dlgTitle">选择</span><span id="dlgTitleZh"></span></div>
      <div class="z" id="dlgDesc"></div>
    </div>    <div class="dlg-search"><input id="dlgSearch" type="search" placeholder="搜索英文 / 中文 / 语境…" autocomplete="off"></div>
    <div class="dlg-list" id="dlgList"></div>
    <div class="dlg-foot">
      <input id="dlgCustom" type="text" placeholder="也可以直接手输（回车确认）" autocomplete="off">
      <button class="btn primary" id="dlgOk" type="button">填入</button>
      <button class="btn" id="dlgClear" type="button">清空此槽</button>
      <button class="btn" id="dlgClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ============================================================
   数据层 1：槽位词库（讲义"待选句 / 可替换词 / 公式 / 注释"）
   每条 = 一个可点击的短语选项，zh 为中文注释
   ============================================================ */
const SLOTS = {
  salutation: { label: '称呼', zh: '按"已知姓 / 已知名 / 已知职位 / 啥也不知道"四档选；讲义：称呼是唯一区分主动信与回复信的地方之一', items: [
    { en: 'Dear Mr. Lee,', zh: '只知道姓（男）', note: '讲义·称呼 1' },
    { en: 'Dear Ms. Lee,', zh: '只知道姓（女）', note: '讲义·称呼 1' },
    { en: 'Dear Paul,', zh: '只知道名（Paul）', note: '讲义·称呼 2' },
    { en: 'Dear John,', zh: '只知道名（John）', note: '讲义·称呼 2' },
    { en: 'Dear David,', zh: '只知道名（David）', note: '2023 英语二真题' },
    { en: 'Dear Professor,', zh: '只知道职位＝教授', note: '讲义·称呼 3；2022 英语一真题' },
    { en: 'Dear Professor Smith,', zh: '职位＋姓氏（更稳）', note: '称呼 3 变体' },
    { en: 'Dear Manager,', zh: '只知道职位＝经理', note: '讲义·称呼 3' },
    { en: 'Dear President,', zh: '主席 / 校长', note: '讲义·称呼 3' },
    { en: 'Dear Editor,', zh: '编辑（投稿、投诉信常用）', note: '讲义·称呼 3' },
    { en: 'Dear Sir or Madam,', zh: '啥也不知道（正式、安全）', note: '讲义·称呼 4' },
    { en: 'Dear Friends,', zh: '面向群体的告示 / 邀请', note: '讲义·称呼 4' },
    { en: 'Dear international students,', zh: '面向留学生群体', note: '2022 英语二真题' },
    { en: 'Dear all,', zh: '全体成员（通知、纪要常用）', note: '称呼 4 变体' }
  ] },

  sign: { label: '结束语', zh: '落款礼貌语：讲义标准写法是 Yours sincerely, 再换行写 Li Ming（右下角）', items: [
    { en: 'Yours sincerely,', zh: '标准落款（知道对方姓名）', note: '讲义落款' },
    { en: 'Yours faithfully,', zh: '不知道对方姓名时用（配 Dear Sir or Madam）', note: '英式正式' },
    { en: 'Best regards,', zh: '熟人 / 朋友之间', note: '非正式' }
  ] },

  signName: { label: '署名', zh: '落款姓名：题目没要求时一律写 Li Ming（英语二常用 Zhang Wei）', items: [
    { en: 'Li Ming', zh: '李明（英语一默认）' },
    { en: 'Zhang Wei', zh: '张伟（英语二真题常用）' },
    { en: 'Wang Fang', zh: '王芳' }
  ] },

  adj: { label: '心情形容词', zh: '紧跟 I am so ___ to hear that；积极来信用前三个，消极来信用后两个', items: [
    { en: 'pleased', zh: '高兴（积极）', note: '对方来信＝赞美 / 分享 / 询问' },
    { en: 'glad', zh: '高兴（更口语）', note: '积极语境' },
    { en: 'excited', zh: '激动', note: '积极语境，活动类' },
    { en: 'sorry', zh: '遗憾 / 抱歉', note: '消极语境：投诉、坏消息、我的过错' },
    { en: 'disappointed', zh: '失望', note: '消极语境' }
  ] },

  news: { label: '背景提要内容', zh: '省略号内容＝摘抄或改编题干（同义词替换 / 主动被动转换），实在改不出就省略', items: [
    { en: 'you are interested in the innovative craft-making exhibition', zh: '你对创新手工艺展感兴趣', note: '2025 英语一' },
    { en: 'you are interested in the play based on a classic Chinese novel', zh: '你对改编自中国古典小说的话剧感兴趣', note: '2025 英语二' },
    { en: "you are interested in the Chinese families' handwritten letters", zh: '你对中国家书感兴趣', note: '2026 英语一' },
    { en: 'you are interested in the art exhibition', zh: '你对艺术展感兴趣', note: '2023 英语二' },
    { en: 'you are coming to visit our university next month', zh: '你下个月要来我校访问', note: '邀请 / 接待类' },
    { en: 'you have been admitted to our university', zh: '你已被我校录取', note: '祝贺类' },
    { en: 'you are preparing a speech about a scientist', zh: '你在准备一篇关于科学家的演讲稿', note: '2024 英语一' }
  ] },

  thing: { label: '分享之物', zh: 'Thank you for sharing ___ with me 的宾语', items: [
    { en: 'the video of your family trip in China', zh: '你中国家庭旅行的视频', note: '2026 英语二' },
    { en: 'your photos of the campus', zh: '你的校园照片', note: '日常往来' },
    { en: 'the book you recommended', zh: '你推荐的书', note: '日常往来' },
    { en: 'your advice on my plan', zh: '你对我计划的建议', note: '感谢 / 回复类' }
  ] },

  topic: { label: '主题词', zh: '根据题干内容确定的名词短语，是"信件主题"的落点', items: [
    { en: 'the art exhibition', zh: '艺术展', note: '2023 英语二' },
    { en: 'the coming innovation contest', zh: '即将到来的创新大赛', note: '2022 英语一' },
    { en: 'the food festival', zh: '美食节', note: '2022 英语二' },
    { en: 'your new research project', zh: '你的新研究项目', note: '学术往来' },
    { en: 'the plan for the trip', zh: '旅行计划', note: '计划类' }
  ] },

  mood: { label: '心情名词', zh: 'I want to express my ___ through this letter 的心情词', items: [
    { en: 'disappointment', zh: '不满', note: '讲义：心情——不满' },
    { en: 'displeasure', zh: '不高兴', note: '讲义：心情——不高兴' },
    { en: 'apology', zh: '道歉', note: '道歉信' },
    { en: 'regret', zh: '遗憾', note: '婉拒 / 遗憾' }
  ] },

  purposeNoun: { label: '意图名词', zh: '过渡句 There are two factors accounting for my ___ 用的名词形式', items: [
    { en: 'suggestion', zh: '建议（suggestion / advice）', note: '建议信' },
    { en: 'complaint', zh: '投诉', note: '投诉信' },
    { en: 'invitation', zh: '邀请', note: '邀请信' },
    { en: 'gratitude', zh: '感谢', note: '感谢信' },

  { id: 's13b', no: '13+', cat: '活动·流程环节', en: 'A series of competitions such as robot competition and aircraft competition will be held to arouse students\u2019 enthusiasm for {field}.', zh: '将举办机器人比赛、飞机比赛等一系列竞赛，以激发学生对{field}的热情。', note: '2022 英语一真题改写' },
  { id: 's14', no: '14', cat: '活动·流程环节', en: 'Participants will be divided into teams for a collaborative challenge, designed to foster teamwork and creative problem-solving.', zh: '参与者将被分成小组进行团队协作挑战，旨在培养团队精神与创造性解决问题的能力。', note: '团建 / 破冰环节' },
  { id: 's15', no: '15', cat: '活动·流程环节', en: 'The event will commence with an opening ceremony, followed by a series of workshops and a keynote speech, and will conclude with a discussion session where participants can exchange ideas.', zh: '活动将以开幕式开始，随后是系列研讨会和主题演讲，最后以讨论环节收尾，参与者可在此交流想法。', note: '完整"三段式"流程句' },
  { id: 's16', no: '16', cat: '活动·流程环节', en: 'Following the opening ceremony, the event will feature a keynote speech, workshops, and a concluding discussion session for participant interaction.', zh: '开幕式后，本次活动将包含主题演讲、多场工作坊以及一个互动讨论环节。', note: 's15 的精简版' },
  { id: 's16b', no: '16+', cat: '活动·流程环节', en: 'Following the opening ceremony, the event will feature {stage}, which is designed to enrich students\u2019 campus life.', zh: '开幕式后，活动将安排{stage}，旨在丰富学生的校园生活。', note: '注 1：环节词可在这句里自由替换（开幕式 / 主题演讲 / 工作坊…）' },

  /* 奖励收获 17-20 */
  { id: 's17', no: '17', cat: '活动·奖励收获', en: 'This will be a memorable and rewarding experience and the prizes and souvenirs will be very valuable.', zh: '这将是一次难忘而有收获的经历，奖品和纪念品也将非常珍贵。', note: '注：17~20 句用于"画饼"，写在第二段最后一句' },
  { id: 's18', no: '18', cat: '活动·奖励收获', en: 'To encourage more students to join, the top three winners will receive {reward}, and all shortlisted participants will be awarded bonus points.', zh: '为鼓励更多学生参加，前三名将获得{reward}，所有入围者都将获得加分。', note: '2020 英语一真题改写' },
  { id: 's19', no: '19', cat: '活动·奖励收获', en: 'During the event, you will have the opportunity to meet like-minded individuals, engage in interesting activities, and enjoy a great time together.', zh: '活动期间，你将有机会结识志同道合的人，参与有趣的活动，共度美好时光。', note: '对"个人"画饼，邀请信常用' },
  { id: 's20', no: '20', cat: '活动·奖励收获', en: 'This event will allow you to contribute to the development of our university while gaining valuable experience in {field}.', zh: '此次活动将使你在获得{field}方面宝贵经验的同时，为学校发展做出贡献。', note: '对"贡献＋收获"画饼，志愿 / 招募类' },
  { id: 's20b', no: '20+', cat: '活动·奖励收获', en: 'This activity offers a precious opportunity to broaden your horizons and enrich your campus life.', zh: '这次活动提供了开阔视野、丰富校园生活的宝贵机会。', note: '可接大作文模板"六大方面"' },

  /* 推荐对象 21-27 */
  { id: 's21', no: '21', cat: '推荐对象', en: 'Located in {place}, {obj} is one of the most popular scenic spots in the world.', zh: '坐落于{place}，{obj}是世界上最受欢迎的景点之一。', note: '注：21~24 句交代推荐对象，一般放推荐信第一点，全背' },
  { id: 's22', no: '22', cat: '推荐对象', en: 'Written by a famous writer, {obj} is one of the most popular books in the world.', zh: '由知名作家主笔，{obj}是世界上最受欢迎的书之一。', note: '介绍书籍（Written by / Directed by 可换）' },
  { id: 's23', no: '23', cat: '推荐对象', en: 'Shen Kuo was an outstanding scientist during the Northern Song Dynasty, who made remarkable achievements in many fields.', zh: '沈括是北宋时期一位杰出的科学家，在许多领域都取得了卓越成就。', note: '介绍名人；换成推荐对象即可' },
  { id: 's24', no: '24', cat: '推荐对象', en: 'Planned by the Student Union, the activity is one of the most popular events in our university.', zh: '该活动由学生会策划，是我校最受欢迎的活动之一。', note: '介绍活动' },
  { id: 's25', no: '25', cat: '推荐对象', en: 'While I understand that {ab} has advantages, I believe {obj} will provide you with a more profound and thought-provoking experience.', zh: '虽然我知道{ab}有优势，但我相信{obj}会带给你更深刻、更发人深省的体验。', note: '对比式推荐，适合"二选一"题目' },
  { id: 's26', no: '26', cat: '推荐对象', en: 'I would highly recommend {obj} for its exceptional {feature1} and remarkable {feature2}.', zh: '我强烈推荐{obj}，因为它拥有卓越的{feature1}和非凡的{feature2}。', note: '注：25~27 句需联想特点，考验词汇量，任选 1 句背' },
  { id: 's27', no: '27', cat: '推荐对象', en: 'What makes {obj} highly recommendable is the unique experience it offers, which includes {detail}.', zh: '{obj}之所以值得高度推荐，在于它提供的独特体验，其中包括{detail}。', note: '2023 英语二真题原句' },
  { id: 's27b', no: '27+', cat: '推荐对象', en: 'It offers you a good chance to {doSomething}.', zh: '它给你提供了{doSomething}的好机会。', note: '讲义"简化后充实内容"的 5 个短句之一' },
  { id: 's27c', no: '27++', cat: '推荐对象', en: 'It broadens your horizons and enriches your knowledge.', zh: '它能开阔你的视野、丰富你的知识。', note: '同上，万能收尾短句' },
  { id: 's27d', no: '27+++', cat: '推荐对象', en: 'It will help you {doSomething}.', zh: '它会帮助你{doSomething}。', note: '同上：It will help you (to) do.' },
  { id: 's27e', no: '27++++', cat: '推荐对象', en: 'Through it, you can {doSomething}.', zh: '通过它，你可以{doSomething}。', note: '同上：Through it, you can do.' },
  { id: 's27f', no: '27+++++', cat: '推荐对象', en: 'You will gain a lot from it and improve your {ability}.', zh: '你将从中学到很多，并提升{ability}。', note: '同上：You will gain / acquire / improve…' },

  /* 能力展示 28-33 */
  { id: 's28', no: '28', cat: '能力展示与要求', en: 'Over the past few years, I have consistently excelled in my role, which is evidenced by the awards and recognition I have received.', zh: '过去几年我一直表现出色，所获奖项与认可就是证明。', note: '注 1：28~30 句常用于自荐、推荐、求职，任选 2 句' },
  { id: 's29', no: '29', cat: '能力展示与要求', en: 'I am a highly self-motivated and resilient individual, capable of maintaining focus and productivity in fast-paced environments.', zh: '我是一个高度自律且富有韧性的人，能在快节奏环境中保持专注与高效。', note: '自荐核心句，形容词可换讲义注 2 的能力词' },
  { id: 's30', no: '30', cat: '能力展示与要求', en: 'I thrive in collaborative settings and have often been the one to facilitate communication and integrate diverse viewpoints in the team.', zh: '我在协作环境中能充分发挥，并常在团队中促进沟通、整合不同观点。', note: '强调团队协作' },
  { id: 's31', no: '31', cat: '能力展示与要求', en: 'The selected candidates will assist in conducting surveys, collecting and analyzing data on {field}. Moreover, the candidates should be enthusiastic about {field} and have sound organization and communication skills.', zh: '被选中的候选人将协助调查、收集和分析{field}方面的数据；此外应对{field}有热情，并具备良好的组织与沟通能力。', note: '注 1：31~33 句常用于提出要求（招聘 / 招志愿者 / 找队友）' },
  { id: 's32', no: '32', cat: '能力展示与要求', en: 'The role requires the ability to analyze complex problems, develop practical solutions, and execute them effectively.', zh: '该职位要求具备分析复杂问题、制定可行方案并有效执行的能力。', note: '求职 / 招募的"硬要求"' },
  { id: 's33', no: '33', cat: '能力展示与要求', en: 'The candidates should be enthusiastic about {field} and have sound organization, communication, teaching and planning skills.', zh: '候选人应对{field}有热情，并具备良好的组织、沟通、教学与策划能力。', note: '要求句的短版本' },
  { id: 's33b', no: '33+', cat: '能力展示与要求', en: 'No previous experience is required, for we will provide full training and guidance.', zh: '无需经验，我们将提供完整培训与指导。', note: '讲义"再提供一个万能的"' },

  /* 感谢和道歉 34-40 */
  { id: 's34', no: '34', cat: '感谢与道歉', en: 'I am extremely grateful to you for your unselfish assistance and advice during the period of {period}.', zh: '我非常感谢你在{period}给我的无私帮助与建议。', note: '注：34~38 句就是"拍马屁"，感谢、道歉、邀请都能拍' },
  { id: 's35', no: '35', cat: '感谢与道歉', en: 'It is your hospitality that enabled me to enjoy the stay and learn a lot.', zh: '正是你的款待使我能够享受这段时光并学到很多。', note: '强调句 It is ... that ...，热情 / 帮助可替换' },
  { id: 's36', no: '36', cat: '感谢与道歉', en: 'Without your generous help, I would not have made such great progress in {field}.', zh: '如果没有你的慷慨帮助，我就不会在{field}上取得如此大的进步。', note: '虚拟语气，感谢信提分句' },
  { id: 's37', no: '37', cat: '感谢与道歉', en: 'Without your generous help, I would not have had such a wonderful experience.', zh: '如果没有你的慷慨帮助，我就不会有如此美妙的经历。', note: '2010 英语二真题原句' },
  { id: 's37b', no: '37+', cat: '感谢与道歉', en: 'Without your timely help, I am afraid the consequences would have been truly serious.', zh: '如果没有你的及时帮助，后果恐怕会很严重。', note: '同上，用于强调"及时"' },
  { id: 's38', no: '38', cat: '感谢与道歉', en: 'All of us desire to improve our ability of {ability} under your professional guidance.', zh: '我们期望在您的专业指导下提升{ability}。', note: '拍老师 / 教授；邀请信也能用' },
  { id: 's39', no: '39', cat: '感谢与道歉', en: 'To make up for it, I am ready to immediately correct the mistake and offer my full assistance to resolve the matter.', zh: '为了弥补，我准备立即纠正错误，并全力协助解决问题。', note: '注：39~40 句只用于道歉，任选 1 句' },
  { id: 's40', no: '40', cat: '感谢与道歉', en: 'I assure you that I have learned a valuable lesson from this and will take concrete steps to ensure it does not happen again.', zh: '我向你保证，我已从中吸取宝贵教训，并将采取具体措施确保不再发生。', note: '道歉信结尾承诺' },

  /* 通用型 41-50 */
  { id: 's41', no: '41', cat: '通用万能', en: 'We are badly in need of {thingNeed}, which can help us {doSomething}.', zh: '我们急需{thingNeed}，它能帮助我们{doSomething}。', note: '注：41~50 用途极广，建议全背、灵活运用' },
  { id: 's41b', no: '41+', cat: '通用万能', en: 'We are in urgent need of {thingNeed}, which can help us {doSomething}.', zh: '我们迫切需要{thingNeed}，它能帮助我们{doSomething}。', note: 's41 的同义替换' },
  { id: 's41c', no: '41++', cat: '通用万能', en: 'You are badly in need of {thingNeed}, which can help you {doSomething}.', zh: '你急需{thingNeed}，它能帮助你{doSomething}。', note: '主语换成"你"：写给同学 / 朋友的建议信用' },
  { id: 's42', no: '42', cat: '通用万能', en: 'Due to {reason}, it is impossible for us to {problemEffect}.', zh: '由于{reason}，我们无法{problemEffect}。', note: '投诉 / 建议：讲问题（讲义例句 due to the noisy environment…）' },
  { id: 's43', no: '43', cat: '通用万能', en: 'I wonder if {who} can {askAction} so that we can {doTwo}.', zh: '我想知道{who}是否能{askAction}，这样我们就能{doTwo}。', note: '最万能的"请求"句：主语可以是 you，也可以是图书馆 / 学校' },
  { id: 's43b', no: '43+', cat: '通用万能', en: 'I wonder if you can {askAction} so that I can {doTwo}.', zh: '我想知道你是否能{askAction}，这样我就能{doTwo}。', note: 's43 的"我"版本：请求落到自己身上时用' },
  { id: 's43c', no: '43++', cat: '通用万能', en: 'I wonder if you can {askAction} so that you can {doTwo}.', zh: '我想知道你是否能{askAction}，这样你就能{doTwo}。', note: 's43 的"你"版本：好处给对方时用' },
  { id: 's44', no: '44', cat: '通用万能', en: 'We could have more opportunities to {doSomething} if you improve {thingNeed}.', zh: '如果你能改进{thingNeed}，我们就有更多机会{doSomething}。', note: '建议信的条件句' },
  { id: 's44b', no: '44+', cat: '通用万能', en: 'You could have more opportunities to {doSomething} if you include {include}.', zh: '如果你加入{include}，你就有更多机会{doSomething}。', note: '主语换成"你"；2024 英语一示例句型' },
  { id: 's45', no: '45', cat: '通用万能', en: 'It is advisable to {doSomething}, which can really help you.', zh: '做{doSomething}是明智的，这确实能帮到你。', note: '委婉建议' },
  { id: 's46', no: '46', cat: '通用万能', en: 'Given the fact that {fact}, it would be wise for us to {doSomething}.', zh: '鉴于{fact}这一事实，我们{doSomething}才是明智的。', note: 'Given the fact that 引导原因' },
  { id: 's47', no: '47', cat: '通用万能', en: '{act} provides a unique opportunity to let you explore your creativity.', zh: '{act}提供了一个让你探索创造力的独特机会。', note: '2023 英语二真题改写' },
  { id: 's48', no: '48', cat: '通用万能', en: 'Everyone agrees that your {thingNeed} is the key to the satisfactory outcome.', zh: '大家都认为你的{thingNeed}是取得满意结果的关键。', note: '2026 英语一真题改写（the family letter is key to…）' },
  { id: 's49', no: '49', cat: '通用万能', en: '{act} allows you to experience different cultures and social customs.', zh: '{act}能让你体验不同的文化和社会习俗。', note: '讲义：还可换为 encyclopedic knowledge of nature / science / history' },
  { id: 's50', no: '50', cat: '通用万能', en: 'I am confident that the students will not only have the opportunity to learn from you, but also to draw inspiration from your example.', zh: '我相信学生们不仅有机会向您学习，还能从您的榜样中汲取灵感。', note: '对"人"的收尾句，邀请教授 / 专家' }
];

/* ============================================================
   逻辑层
   ============================================================ */
const MODE_MAP = {};
MODES.forEach(m => { MODE_MAP[m.id] = m; });

const STORE_KEY = 'kaoyan-xzw-puzzle-v1';

const PROPER_WORDS = 'China Chinese English December Sunday Monday Tuesday Wednesday Thursday Friday Saturday January February March April May June July August September October November New Year International Student Union Journey West Anhui Hongcun Shen Kuo Art Aiding Rural Primary School National Day Festival Christmas I'.split(' ');

const DEFAULT_TOGGLES = { bi: true, exam: false, notes: true, ghost: true, polish: true };
const DEFAULT_SLOTS = { sign: 'Yours sincerely,', signName: 'Li Ming' };

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function trunc(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

/* ---------------- 状态 ---------------- */
function defaultPlans(modeId) {
  const key = MODE_MAP[modeId].planKey;
  const set = PLAN_SETS[key];
  return { p1: set.p1[0].id, p2: set.p2[0].id, p3: set.p3[0].id };
}

let state = {
  mode: 'reply',
  plans: defaultPlans('reply'),
  rows: {},
  custom: {},
  slots: clone(DEFAULT_SLOTS),
  toggles: clone(DEFAULT_TOGGLES)
};

let history = [];

function snapshot() {
  return clone({ mode: state.mode, plans: state.plans, rows: state.rows, custom: state.custom, slots: state.slots, toggles: state.toggles });
}
function pushHistory() {
  history.push(snapshot());
  if (history.length > 40) history.shift();
  persist();
}
function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ state: state, history: history.slice(-12) }));
  } catch (e) { /* 隐私模式 / 配额问题：忽略 */ }
}
function restore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.state || !MODE_MAP[d.state.mode]) return false;
    state = Object.assign(state, d.state);
    state.toggles = Object.assign(clone(DEFAULT_TOGGLES), d.state.toggles || {});
    state.slots = Object.assign(clone(DEFAULT_SLOTS), d.state.slots || {});
    history = Array.isArray(d.history) ? d.history : [];
    return true;
  } catch (e) { return false; }
}

/* ---------------- 槽位 ---------------- */
function normApos(s) { return String(s).replace(/[\u2018\u2019]/g, "'"); }

function slotInfo(id) {
  const def = SLOTS[id];
  const v = state.slots[id];
  if (!v) return { empty: true, label: def ? def.label : id, en: '', zh: '', proper: false };
  const item = def ? def.items.find(function (x) { return x.en === v || normApos(x.en) === normApos(v); }) : null;
  return {
    empty: false,
    label: def ? def.label : id,
    en: v,
    zh: item ? item.zh : v,
    proper: item ? !!item.proper : /\b[A-Z][a-z]+/.test(v),
    plural: item ? item.plural : undefined
  };
}
function isPlural(id) {
  const info = slotInfo(id);
  if (info.plural !== undefined) return !!info.plural;
  const t = info.en.trim();
  if (/^(one|a|an)\b/i.test(t)) return false;
  if (/\b(two|three|several|many|both|all|most)\b/i.test(t)) return true;
  if (/\b(and)\b/.test(t)) return true;
  if (/(?:[^s]s|es)$/i.test(t) && !/(?:ss|us|is)$/i.test(t)) return true;
  return false;
}

/* ---------------- 模板渲染 ---------------- */
const TOKEN = /\{(be|s|have|do):([A-Za-z][A-Za-z0-9_]*)\}|\{([A-Za-z][A-Za-z0-9_]*)\}/g;

function splitTemplate(tpl) {
  const frags = [];
  let last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(tpl))) {
    if (m.index > last) frags.push({ kind: 'lit', text: tpl.slice(last, m.index) });
    if (m[3]) {
      frags.push({ kind: 'slot', slot: m[3] });
    } else {
      const op = m[1], sid = m[2];
      const pl = isPlural(sid);
      let w = '';
      if (op === 'be') w = pl ? 'are' : 'is';
      else if (op === 'have') w = pl ? 'have' : 'has';
      else if (op === 'do') w = pl ? 'do' : 'does';
      else w = pl ? 's' : '';
      frags.push({ kind: 'lit', text: w, auto: true });
    }
    last = TOKEN.lastIndex;
  }
  if (last < tpl.length) frags.push({ kind: 'lit', text: tpl.slice(last) });
  return frags;
}

function buildFrags(tpl) {
  return splitTemplate(tpl).map(function (f) {
    if (f.kind === 'lit') return { kind: 'lit', text: f.text, proper: false };
    const info = slotInfo(f.slot);
    return {
      kind: 'slot', slot: f.slot, info: info, proper: info.proper,
      text: info.empty ? '【' + info.label + '】' : info.en
    };
  });
}

function renderTpl(enTpl, zhTpl) {
  const frags = buildFrags(enTpl);
  let fixes = 0;
  if (state.toggles.polish) {
    // 1) 句首大写
    for (let i = 0; i < frags.length; i++) {
      const f = frags[i];
      const idx = f.text.search(/[A-Za-z]/);
      if (idx < 0) continue;
      const ch = f.text[idx];
      if (ch !== ch.toUpperCase()) {
        f.text = f.text.slice(0, idx) + ch.toUpperCase() + f.text.slice(idx + 1);
        fixes++;
      }
      break;
    }
    // 2) 逗号后非专有名词降小写
    for (let i = 0; i < frags.length; i++) {
      const f = frags[i];
      let prev = '';
      for (let j = i - 1; j >= 0; j--) { if (frags[j].text) { prev = frags[j].text; break; } }
      if (!/,\s+$/.test(prev)) continue;
      const m = f.text.match(/^(\s*)([A-Z][A-Za-z'\u2019-]*)/);
      if (!m) continue;
      const word = m[2];
      if (word.length < 2) continue;
      if (word === word.toUpperCase()) continue;
      if (f.proper) continue;
      if (PROPER_WORDS.indexOf(word) >= 0) continue;
      f.text = m[1] + word.charAt(0).toLowerCase() + f.text.slice(m[0].length);
      fixes++;
    }
  }
  let html = '', text = '';
  const missing = [];
  frags.forEach(function (f) {
    if (f.kind === 'lit') {
      text += f.text;
      html += '<span class="lit">' + esc(f.text) + '</span>';
    } else {
      const info = f.info;
      text += f.text;
      if (info.empty) {
        missing.push(info.label);
        html += '<button type="button" class="chip empty" data-slot="' + f.slot + '" title="点击选择：' + esc(info.label) + '">【' + esc(info.label) + '】</button>';
      } else {
        html += '<button type="button" class="chip" data-slot="' + f.slot + '" title="点击更换：' + esc(info.label) + '">' + esc(f.text) + '</button>';
      }
    }
  });
  // 中文对照：用同一条目的中文模板重新拼
  let zh = '';
  const zt = zhTpl === undefined ? enTpl : zhTpl;
  if (zt) {
    const zf = buildFrags(zt);
    zf.forEach(function (f) {
      if (f.kind === 'lit') { zh += f.text; return; }
      const info = f.info;
      zh += info.empty ? '【' + info.label + '】' : String(info.zh).replace(/（[^）]*）/g, '');
    });
  }
  return { html: html, text: text, zh: zh, missing: missing, fixes: fixes };
}

/* ---------------- 行 / 方案 ---------------- */
function curMode() { return MODE_MAP[state.mode]; }

function planSet(para) {
  const m = curMode();
  return (PLAN_SETS[m.planKey] || {})[para] || [];
}

function applyPlanRows(para, planId) {
  const set = planSet(para);
  const plan = set.find(p => p.id === planId) || set[0];
  const rows = curMode()[para] || [];
  rows.forEach(function (row, i) {
    const v = plan.rows[i];
    state.rows[row.id] = (v === undefined ? '' : v);
    if (state.rows[row.id] !== '__custom') delete state.custom[row.id];
  });
  if (plan) state.plans[para] = plan.id;
}

function syncAllPlans() {
  ['p1', 'p2', 'p3'].forEach(function (p) { applyPlanRows(p, state.plans[p]); });
}

function findItemInBank(bank, id) {
  for (let i = 0; i < bank.length; i++) if (bank[i].id === id) return bank[i];
  return null;
}

function rowItem(row) {
  const v = state.rows[row.id];
  if (!v || v === '__custom') return null;
  const bank = BANKS[row.bank] || [];
  return findItemInBank(bank, v);
}

/* ---------------- 渲染：编排区 ---------------- */
const composerEl = document.getElementById('composer');
const previewEl = document.getElementById('preview');
const statEl = document.getElementById('stat');
const modeBadge = document.getElementById('modeBadge');
const modeHint = document.getElementById('modeHint');

function optionsHtml(bank, cur, optional) {
  let h = '';
  h += '<option value=""' + (cur === '' ? ' selected' : '') + '>（不写这一句）</option>';
  h += '<option value="__custom"' + (cur === '__custom' ? ' selected' : '') + '>✎ 自定义整句…</option>';
  const groups = [];
  const map = {};
  bank.forEach(function (it) {
    const g = it.cat || '其余';
    if (!map[g]) { map[g] = []; groups.push(g); }
    map[g].push(it);
  });
  groups.forEach(function (g) {
    h += '<optgroup label="' + esc(g) + '">';
    map[g].forEach(function (it) {
      const plain = String(it.en || '').replace(/\{[^}]*\}/g, '…').replace(/…(\s*…)+/g, '…');
      const label = (it.no ? it.no + '. ' : '') + trunc(plain, 64);
      h += '<option value="' + esc(it.id) + '"' + (cur === it.id ? ' selected' : '') + '>' + esc(label) + '</option>';
    });
    h += '</optgroup>';
  });
  return h;
}

function rowRender(row) {
  if (row.tpl) {
    const r = renderTpl(row.tpl, row.zhTpl);
    return { html: r.html, text: r.text, zh: r.zh, missing: r.missing, tpl: true };
  }
  const cur = state.rows[row.id];
  if (!cur) return null;
  if (cur === '__custom') {
    const t = (state.custom[row.id] || '').trim();
    if (!t) return null;
    return { html: esc(t), text: t, zh: t, missing: [], custom: true };
  }
  const item = rowItem(row);
  if (!item) return null;
  const r = renderTpl(item.en, item.zh);
  return { html: r.html, text: r.text, zh: r.zh, missing: r.missing };
}

function renderRow(row, n) {
  const tag = row.standalone ? esc(row.label) : '句' + n;
  if (row.tpl) {
    const r = rowRender(row);
    return '<div class="row" data-row="' + row.id + '">' +
      '<div class="rowhead"><span class="tag">' + tag + '</span>' +
      '<span class="rlabel">点句子里的彩色词即可替换</span></div>' +
      '<div class="sentence">' + r.html + '</div></div>';
  }
  const cur = state.rows[row.id] === undefined ? '' : state.rows[row.id];
  const label = row.standalone ? '' : '<span class="rlabel">' + esc(row.label) + '</span>';
  let inner = '', note = '';
  if (cur === '__custom') {
    const t = state.custom[row.id] || '';
    inner = '<textarea class="custom" data-custom="' + row.id + '" rows="2" placeholder="直接写这一句英文">' + esc(t) + '</textarea>';
    note = '<div class="note">自定义句：<b>不参与</b>自动润色，请自行检查语法。</div>';
  } else {
    const item = rowItem(row);
    if (!item) {
      inner = '<div class="sentence missing">（这一句暂时不写）</div>';
    } else {
      const r = renderTpl(item.en, item.zh);
      inner = '<div class="sentence">' + r.html + '</div>';
      note = '<div class="note">' + (item.note ? esc(item.note) + ' · ' : '') + '中文：' + esc(r.zh) + '</div>';
    }
  }
  return '<div class="row" data-row="' + row.id + '">' +
    '<div class="rowhead"><span class="tag">' + tag + '</span>' + label +
    '<select data-sel="' + row.id + '" aria-label="切换句子方案">' + optionsHtml(BANKS[row.bank] || [], cur, !!row.optional) + '</select></div>' +
    inner + note + '</div>';
}

function renderBlock(title, sub, para, rows, planOptions) {
  let planSel = '';
  if (planOptions && planOptions.length) {
    planSel = '<label class="planlabel">段落方案 <select data-plan="' + para + '">' +
      planOptions.map(function (p) {
        return '<option value="' + p.id + '"' + (state.plans[para] === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('') + '</select></label>';
  }
  const body = rows.map(function (r, i) { return renderRow(r, i + 1); }).join('');
  return '<section class="block" data-block="' + para + '">' +
    '<div class="blockhead"><h3>' + esc(title) + '</h3><span class="sub">' + esc(sub || '') + '</span>' +
    '<span class="grow"></span>' + planSel + '</div>' +
    '<div class="blockbody">' + body + '</div></section>';
}

function renderComposer() {
  const m = curMode();
  let html = '';
  if (m.pre && m.pre.length) {
    html += '<section class="block" data-block="pre"><div class="blockhead"><h3>' + (m.id === 'minutes' ? '格式头' : '格式') + '</h3>' +
      '<span class="sub">' + (m.id === 'minutes' ? '讲义 2.3：Date / Time / Location / Objective / Attendees' : '称呼：仔细读题，搞清收信人') + '</span></div>' +
      '<div class="blockbody">' + m.pre.map(function (r, i) { return renderRow(r, i + 1); }).join('') + '</div></section>';
  }
  html += renderBlock(m.id === 'minutes' ? '导语（第一段）' : '第一段', m.id === 'minutes' ? '导入＋会议目的' : (m.id === 'notice' ? '通知概况＋通知目的' : '背景提要＋来信意图'), 'p1', m.p1, planSet('p1'));
  html += renderBlock(m.id === 'minutes' ? '主体（第二段）' : '第二段', '具体内容或原因分析（先过渡句，再 2~3 句分点；讲义：弱化题型区分，强化功能表达）', 'p2', m.p2, planSet('p2'));
  html += renderBlock(m.id === 'minutes' ? '结论（第三段）' : '第三段', m.id === 'notice' ? '发出邀请＋报名方式' : (m.id === 'minutes' ? '最终决定＋下次会议' : '表示情感＋期待回信'), 'p3', m.p3, planSet('p3'));
  if (m.post && m.post.length) {
    html += '<section class="block" data-block="post"><div class="blockhead"><h3>落款</h3><span class="sub">' + (m.id === 'minutes' ? 'Recorded by' : 'Yours sincerely, Li Ming') + '</span></div>' +
      '<div class="blockbody">' + m.post.map(function (r, i) { return renderRow(r, i + 1); }).join('') + '</div></section>';
  }
  composerEl.innerHTML = html;
  modeBadge.textContent = m.short;
  modeHint.innerHTML = '<b>' + esc(m.name) + '</b>　' + esc(m.intro) + '<span class="src">' + esc(m.src) + '</span>';
}

/* ---------------- 渲染：预览 ---------------- */
function toLine(r) {
  if (!r) return null;
  return {
    en: r.text,
    zh: r.zh,
    html: r.html.replace(/<button[^>]*class="chip[^"]*"[^>]*>/g, '<span class="sh">').replace(/<\/button>/g, '</span>'),
    missing: r.missing,
    plain: !r.html
  };
}

function renderPreview() {
  const m = curMode();
  const p1 = [];
  (m.head || []).forEach(function (h) { p1.push({ en: h, zh: '', plain: true }); });
  (m.pre || []).forEach(function (row) { const v = toLine(rowRender(row)); if (v) p1.push(v); });
  (m.p1 || []).forEach(function (row) { const v = toLine(rowRender(row)); if (v) p1.push(v); });
  const p2 = [];
  (m.p2 || []).forEach(function (row) { const v = toLine(rowRender(row)); if (v) p2.push(v); });
  const p3 = [];
  (m.p3 || []).forEach(function (row) { const v = toLine(rowRender(row)); if (v) p3.push(v); });
  (m.post || []).forEach(function (row) { const v = toLine(rowRender(row)); if (v) p3.push(v); });

  const blocks = [
    { title: m.id === 'minutes' ? '导语' : '第一段', lines: p1 },
    { title: m.id === 'minutes' ? '主体' : '第二段', lines: p2 },
    { title: m.id === 'minutes' ? '结论' : '第三段', lines: p3 }
  ];

  let html = '', words = 0, missingCount = 0;
  blocks.forEach(function (b) {
    if (!b.lines.length) return;
    html += '<section class="pblock"><h4><span class="cn">' + b.title + '</span></h4>';
    b.lines.forEach(function (ln) {
      if (ln.plain) {
        html += '<div class="pen">' + esc(ln.en) + '</div>';
      } else {
        html += '<div class="pen">' + ln.html + '</div>';
        if (ln.zh && ln.zh !== ln.en) html += '<div class="pzh">' + esc(ln.zh) + '</div>';
      }
      if (ln.missing) missingCount += ln.missing.length;
      words += (ln.en.match(/[A-Za-z][A-Za-z'\u2019-]*/g) || []).length;
    });
    html += '</section>';
  });
  if (!html) html = '<div class="pen placeholder">还没有内容：先选一个真题预设，或从第一段开始点选句子。</div>';
  previewEl.innerHTML = html;
  statEl.textContent = '约 ' + words + ' 词 · 空槽 ' + missingCount;
}

function render() {
  document.body.classList.toggle('exam', !!state.toggles.exam);
  document.body.classList.toggle('no-zh', !state.toggles.bi);
  document.body.classList.toggle('no-note', !state.toggles.notes);
  document.body.classList.toggle('no-ghost', !state.toggles.ghost);
  Array.prototype.forEach.call(document.querySelectorAll('input[data-toggle]'), function (cb) {
    cb.checked = !!state.toggles[cb.getAttribute('data-toggle')];
  });
  renderComposer();
  renderPreview();
  document.getElementById('undoBtn').disabled = history.length === 0;
  const ps = document.getElementById('presetSel');
  if (ps && ps.value) ps.value = '';
  persist();
}

/* ---------------- 顶栏 ---------------- */
function renderModes() {
  const box = document.getElementById('modes');
  box.innerHTML = MODES.map(function (m) {
    return '<button type="button" class="mode" data-mode="' + m.id + '" aria-pressed="' + (state.mode === m.id) + '">' + esc(m.name) + '</button>';
  }).join('');
}

function renderPresets() {
  const sel = document.getElementById('presetSel');
  let html = '<option value="">— 选择真题，一键载入整篇 —</option>';
  PRESETS.forEach(function (p) {
    html += '<option value="' + p.id + '">' + esc(p.label) + '</option>';
  });
  sel.innerHTML = html;
  sel.value = '';
}

const TOGGLE_DEFS = [
  { key: 'bi', label: '中英对照' },
  { key: 'exam', label: '考场精简' },
  { key: 'notes', label: '句子注释' },
  { key: 'ghost', label: '占位提示' },
  { key: 'polish', label: '自动润色' }
];

function renderToggles() {
  const box = document.getElementById('toggles');
  box.innerHTML = TOGGLE_DEFS.map(function (t) {
    return '<label class="tg"><input type="checkbox" data-toggle="' + t.key + '"' + (state.toggles[t.key] ? ' checked' : '') + '><span class="sw"></span>' + esc(t.label) + '</label>';
  }).join('');
}

/* ---------------- 预设 ---------------- */
function loadPreset(p) {
  pushHistory();
  state.mode = p.mode;
  state.plans = defaultPlans(p.mode);
  if (p.plan1) state.plans.p1 = p.plan1;
  if (p.p2plan) state.plans.p2 = p.p2plan;
  state.rows = {};
  state.custom = {};
  state.slots = clone(DEFAULT_SLOTS);
  Object.assign(state.slots, clone(p.slots || {}));
  syncAllPlans();
  Object.assign(state.rows, clone(p.rows || {}));
  Object.assign(state.custom, clone(p.custom || {}));
  renderModes();
  render();
  toast('已载入：' + p.label);
}

function switchMode(id) {
  if (!MODE_MAP[id] || id === state.mode) return;
  pushHistory();
  state.mode = id;
  state.plans = defaultPlans(id);
  syncAllPlans();
  renderModes();
  render();
}

/* ---------------- 弹层 ---------------- */
let dlgSlot = null;
const overlay = document.getElementById('overlay');
const dlgList = document.getElementById('dlgList');
const dlgSearch = document.getElementById('dlgSearch');
const dlgCustom = document.getElementById('dlgCustom');

function renderDlgList() {
  const def = SLOTS[dlgSlot];
  if (!def) return;
  const q = (dlgSearch.value || '').trim().toLowerCase();
  const cur = state.slots[dlgSlot] || '';
  let html = '';
  def.items.forEach(function (it, i) {
    const hay = (it.en + ' ' + it.zh + ' ' + (it.note || '')).toLowerCase();
    if (q && hay.indexOf(q) < 0) return;
    html += '<button type="button" class="opt" data-opt="' + i + '" aria-selected="' + (cur === it.en) + '">' +
      '<div class="en">' + esc(it.en) + '</div>' +
      '<div class="zh">' + esc(it.zh) + '</div>' +
      (it.note ? '<div class="tagline">' + esc(it.note) + '</div>' : '') + '</button>';
  });
  if (!html) html = '<div class="opt"><div class="zh">没有匹配项，可在下方直接手输。</div></div>';
  dlgList.innerHTML = html;
}

function openDialog(slotId) {
  const def = SLOTS[slotId];
  if (!def) return;
  dlgSlot = slotId;
  document.getElementById('dlgTitle').textContent = def.label;
  document.getElementById('dlgTitleZh').textContent = '（' + def.zh + '）';
  document.getElementById('dlgDesc').textContent = '点选下面的短语，或在下方手输；改完立刻回填到句子里。每一项都标了适用语境。';
  dlgSearch.value = '';
  const cur = state.slots[slotId] || '';
  const isBank = def.items.some(function (x) { return x.en === cur || normApos(x.en) === normApos(cur); });
  dlgCustom.value = cur && !isBank ? cur : '';
  renderDlgList();
  overlay.hidden = false;
  setTimeout(function () { dlgSearch.focus(); }, 30);
}

function closeDialog() {
  overlay.hidden = true;
  dlgSlot = null;
}

function setSlot(slotId, val) {
  pushHistory();
  if (val == null || val === '') delete state.slots[slotId];
  else state.slots[slotId] = val;
  render();
}

/* ---------------- 事件绑定 ---------------- */
document.getElementById('modes').addEventListener('click', function (e) {
  const b = e.target.closest('[data-mode]');
  if (b) switchMode(b.getAttribute('data-mode'));
});

document.getElementById('presetSel').addEventListener('change', function (e) {
  const p = PRESETS.find(function (x) { return x.id === e.target.value; });
  if (p) loadPreset(p);
});

document.getElementById('toggles').addEventListener('change', function (e) {
  const k = e.target.getAttribute('data-toggle');
  if (!k) return;
  pushHistory();
  state.toggles[k] = !!e.target.checked;
  render();
});

composerEl.addEventListener('change', function (e) {
  const t = e.target;
  if (t.hasAttribute('data-sel')) {
    const rowId = t.getAttribute('data-sel');
    pushHistory();
    state.rows[rowId] = t.value;
    if (t.value !== '__custom') delete state.custom[rowId];
    render();
  } else if (t.hasAttribute('data-plan')) {
    const para = t.getAttribute('data-plan');
    pushHistory();
    applyPlanRows(para, t.value);
    render();
  }
});

composerEl.addEventListener('input', function (e) {
  const t = e.target;
  if (t.hasAttribute('data-custom')) {
    state.custom[t.getAttribute('data-custom')] = t.value;
    renderPreview();
    persist();
  }
});

composerEl.addEventListener('click', function (e) {
  const chip = e.target.closest('[data-slot]');
  if (chip) openDialog(chip.getAttribute('data-slot'));
});

dlgList.addEventListener('click', function (e) {
  const b = e.target.closest('[data-opt]');
  if (!b || !dlgSlot) return;
  const def = SLOTS[dlgSlot];
  const it = def.items[Number(b.getAttribute('data-opt'))];
  const slot = dlgSlot;
  closeDialog();
  setSlot(slot, it.en);
});

dlgSearch.addEventListener('input', renderDlgList);
document.getElementById('dlgClose').addEventListener('click', closeDialog);
document.getElementById('dlgClear').addEventListener('click', function () {
  const s = dlgSlot; closeDialog(); if (s) setSlot(s, '');
});
document.getElementById('dlgOk').addEventListener('click', function () {
  const s = dlgSlot, v = dlgCustom.value.trim();
  if (!s) return;
  closeDialog();
  setSlot(s, v);
});
dlgCustom.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('dlgOk').click(); }
});
overlay.addEventListener('click', function (e) {
  if (e.target === overlay) closeDialog();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !overlay.hidden) closeDialog();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    undo();
  }
});

/* ---------------- 撤销 / 清空 / 复制 ---------------- */
function undo() {
  if (!history.length) { toast('没有可撤销的操作'); return; }
  const prev = history.pop();
  state = Object.assign(state, prev);
  if (!MODE_MAP[state.mode]) state.mode = 'reply';
  state.toggles = Object.assign(clone(DEFAULT_TOGGLES), prev.toggles || {});
  renderModes();
  renderToggles();
  render();
  toast('已撤销一步');
}

document.getElementById('undoBtn').addEventListener('click', undo);

document.getElementById('clearBtn').addEventListener('click', function () {
  pushHistory();
  state.custom = {};
  state.slots = clone(DEFAULT_SLOTS);
  state.rows = {};
  state.plans = defaultPlans(state.mode);
  syncAllPlans();
  render();
  toast('已清空（可用撤销恢复）');
});

function plainText() {
  const m = curMode();
  const out = [];
  const headLines = [];
  (m.head || []).forEach(function (h) { headLines.push(h); });
  (m.pre || []).forEach(function (row) {
    const v = rowRender(row);
    if (v && v.text.trim()) headLines.push(v.text.trim());
  });
  if (headLines.length) out.push(headLines.join('\n'));
  ['p1', 'p2', 'p3'].forEach(function (p) {
    const lines = [];
    (m[p] || []).forEach(function (row) {
      const v = rowRender(row);
      if (v && v.text.trim()) lines.push(v.text.trim());
    });
    if (lines.length) out.push(lines.join(' '));
  });
  const tails = [];
  (m.post || []).forEach(function (row) {
    const v = rowRender(row);
    if (v && v.text.trim()) tails.push(v.text.trim());
  });
  if (tails.length) out.push(tails.join('\n'));
  return out.join('\n\n');
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (err) { reject(err); }
  });
}

document.getElementById('copyBtn').addEventListener('click', function () {
  const text = plainText();
  if (!text.trim()) { toast('还没有内容可复制'); return; }
  copyText(text).then(function () { toast('已复制全文（约 ' + (text.match(/[A-Za-z][A-Za-z'\u2019-]*/g) || []).length + ' 词）'); })
    .catch(function () { toast('复制失败：可手动选中预览区文字'); });
});

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
}

/* ---------------- 启动 ---------------- */
const restored = restore();
if (!restored) {
  state.plans = defaultPlans('reply');
  syncAllPlans();
}
renderModes();
renderToggles();
renderPresets();
render();
})();

</script>
</body>
</html>
